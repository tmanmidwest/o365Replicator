<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}o365Replicator{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">✉</span>
      <div>
        <strong>o365Replicator</strong>
        <small>mock M365 email provisioning</small>
      </div>
    </div>
    <nav>
      <a href="/" class="{{ 'on' if active == 'dashboard' else '' }}">Mailboxes</a>
      <a href="/new" class="{{ 'on' if active == 'new' else '' }}">New hire</a>
      <a href="/settings" class="{{ 'on' if active == 'settings' else '' }}">Settings</a>
      <a href="/activity" class="{{ 'on' if active == 'activity' else '' }}">Activity</a>
      <a href="/docs" target="_blank" rel="noopener">API&nbsp;↗</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>o365Replicator · POC provisioning simulator</span>
  </footer>
</body>
</html>
