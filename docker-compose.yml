services:
  o365replicator:
    build: .
    image: o365replicator:latest
    container_name: o365replicator
    ports:
      # Host:container. Both follow ${PORT} so changing the port needs one var.
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # --- server / runtime (read at container launch) ---
      HOST: "0.0.0.0"
      PORT: "${PORT:-8080}"
      # Trust proxy headers from the Cloudflare tunnel. Narrow this to the tunnel's
      # source IP if you want to be stricter than "*".
      FORWARDED_ALLOW_IPS: "*"
      # Uvicorn worker processes. Keep at 1 for SQLite (see README caveat).
      WEB_CONCURRENCY: "1"
      LOG_LEVEL: "info"

      # --- application config ---
      DATABASE_URL: sqlite:////data/o365replicator.db
      DEFAULT_EMAIL_FORMAT: first.last
      DEFAULT_DOMAIN: demo365.local
      # Optional legacy static key accepted via X-API-Key (UI can mint keys too).
      API_KEY: ""
      # Bootstrap admin (optional). Leave blank to use the first-run setup screen.
      # Prefer setting these via a .env file or secrets, not committed compose.
      ADMIN_USERNAME: ""
      ADMIN_PASSWORD: ""
      SESSION_TTL_HOURS: "12"
      # True behind the Cloudflare tunnel (HTTPS). Only set false for local http.
      COOKIE_SECURE: "true"
      OAUTH_TOKEN_TTL_SECONDS: "3600"
    volumes:
      - o365_data:/data
    restart: unless-stopped

volumes:
  o365_data:
